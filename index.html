<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tewodros Abebe — Frontend developer crafting fast, accessible and beautiful web experiences with React, Next.js and TypeScript."
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var isDark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          var root = document.documentElement;
          root.classList.toggle("dark", isDark);
          root.style.colorScheme = isDark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <style>
      html { background: #f8f6ef; }
      html.dark { background: #070b14; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unicons.iconscout.com/release/v4.0.8/css/line.css"
    />
    <link rel="stylesheet" href="/styles.css" />
    <title>Tewodros Abebe | Frontend Developer</title>
  </head>
  <body>
    <div class="boot" id="boot" role="status" aria-live="polite" aria-label="Loading portfolio">
      <div class="boot__buddy" id="boot-buddy" aria-hidden="true">
        <div class="boot__body">
          <span class="boot__arm"><i></i></span>
          <span class="boot__eye"><i></i></span>
          <span class="boot__eye"><i></i></span>
          <span class="boot__glasses"></span>
          <span class="boot__smile"></span>
        </div>
        <div class="boot__shadow"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var buddy = document.getElementById("boot-buddy");
        if (!buddy) return;
        var angle = Math.random() * Math.PI * 2;
        var x = Math.cos(angle);
        var y = Math.sin(angle);
        var reach = 120 / Math.max(Math.abs(x), Math.abs(y));
        buddy.style.setProperty("--boot-x", (x * reach).toFixed(1) + "vw");
        buddy.style.setProperty("--boot-y", (y * reach).toFixed(1) + "vh");
        buddy.classList.add("is-entering");
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
